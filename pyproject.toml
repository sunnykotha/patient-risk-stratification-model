[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-risk-stratification"
version = "0.1.0"
description = "Patient 30-day readmission risk stratification pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]